name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-${{ hashFiles('website/shiny-app/app.R') }}
          restore-keys: r-

      - name: Cache Shinylive export
        id: cache-shinylive
        uses: actions/cache@v4
        with:
          path: website/app
          key: shinylive-v0.4.1-${{ hashFiles('website/shiny-app/app.R', 'website/shiny-app/data/**') }}

      - name: Install system dependencies
        if: steps.cache-shinylive.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libssl-dev \
            libcurl4-openssl-dev libxml2-dev libuv1-dev libarchive-dev

      - name: Install R packages
        if: steps.cache-shinylive.outputs.cache-hit != 'true'
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript -e "
            options(repos = c(
              RSPM = 'https://packagemanager.posit.co/cran/__linux__/noble/latest',
              CRAN = 'https://cloud.r-project.org'
            ))
            pkgs <- c('remotes', 'shiny', 'bslib', 'dplyr', 'tidyr',
                      'jsonlite', 'leaflet', 'sf', 'DT', 'plotly')
            install.packages(pkgs)
            remotes::install_github('posit-dev/r-shinylive@v0.4.1', quiet = TRUE)
            missing <- c(pkgs, 'shinylive')[!c(pkgs, 'shinylive') %in% installed.packages()[,'Package']]
            if (length(missing)) stop('Failed to install: ', paste(missing, collapse = ', '))
          "

      - name: Export Shinylive app
        if: steps.cache-shinylive.outputs.cache-hit != 'true'
        working-directory: website
        run: Rscript -e "shinylive::export('shiny-app', 'app', overwrite=TRUE)"

      - name: Render Quarto site
        working-directory: website
        run: quarto render

      - name: Add .nojekyll
        run: touch website/_site/.nojekyll

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: website/_site
          branch: gh-pages
          clean: true
